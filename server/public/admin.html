<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schematic Index - Admin</title>
<style>
  :root {
    --accent:#2a7a5b; --accent-bright:#3fa87f; --bg:#0f1114; --surface:#171a1e;
    --card:#1e2227; --line:#2c3238; --text:#f2f4f5; --mute:#a8b0b6; --ash:#6e767c;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; }
  a { color:var(--accent-bright); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; } header h1 b { color:var(--accent-bright); }
  header .sp { flex:1; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); padding:7px 12px; border-radius:6px; cursor:pointer; }
  button:hover { border-color:var(--accent-bright); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { border-color:#5a2a2a; color:#ff9d9d; }
  button.small { padding:4px 9px; font-size:12px; }
  input, textarea, select { font:inherit; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:6px; width:100%; }
  textarea { min-height:90px; resize:vertical; }
  label { display:block; font-size:12px; color:var(--mute); margin:10px 0 4px; }
  nav { display:flex; gap:6px; padding:12px 20px 0; }
  nav button.tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { padding:16px 20px 60px; max-width:900px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th { color:var(--ash); font-weight:600; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; background:var(--surface); border:1px solid var(--line); color:var(--mute); }
  .pill.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pill.warn { color:#ff9d9d; border-color:#5a2a2a; }
  #login { max-width:360px; margin:12vh auto; }
  #status { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:9px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #status.show { opacity:1; }
  .muted { color:var(--mute); } .mono { font-family:ui-monospace, monospace; }
  .hide { display:none !important; }
</style>
</head>
<body>

<div id="login" class="card">
  <h1 style="margin-top:0">The Schematic Index - Admin</h1>
  <p class="muted">Enter your owner key to continue.</p>
  <input id="key" type="password" placeholder="Owner key" autocomplete="off" />
  <div style="margin-top:12px"><button class="primary" onclick="login()">Sign in</button></div>
  <p id="loginErr" class="hide" style="color:#ff9d9d"></p>
</div>

<div id="app" class="hide">
  <header>
    <h1>The Schematic <b>Index</b> - Admin</h1>
    <div class="sp"></div>
    <button class="small" onclick="logout()">Sign out</button>
  </header>
  <nav>
    <button class="tab active" data-tab="news">News</button>
    <button class="tab" data-tab="posts">Posts</button>
    <button class="tab" data-tab="reports">Reports</button>
    <button class="tab" data-tab="codes">Codes</button>
  </nav>
  <main>
    <section id="tab-news">
      <div class="card">
        <h3 style="margin-top:0">Post an update</h3>
        <div class="grid2">
          <div><label>Version / badge</label><input id="n-badge" placeholder="v0.9" /></div>
          <div><label>Date shown</label><input id="n-date" placeholder="Aug 13, 2026" /></div>
        </div>
        <label>Title</label><input id="n-title" placeholder="What changed" />
        <label>Body (blank line = new paragraph)</label><textarea id="n-body"></textarea>
        <label class="row" style="margin-top:10px"><input id="n-hl" type="checkbox" style="width:auto" /> &nbsp;Highlight (newest - accent badge)</label>
        <div style="margin-top:12px"><button class="primary" onclick="postNews()">Publish update</button></div>
      </div>
      <div class="card"><h3 style="margin-top:0">Published</h3><div id="newsList"></div></div>
    </section>

    <section id="tab-posts" class="hide">
      <div class="card"><table id="postsTable"><thead><tr><th>Title</th><th>Poster</th><th>Cat</th><th>Likes</th><th>DLs</th><th>Reports</th><th>State</th><th></th></tr></thead><tbody></tbody></table></div>
    </section>

    <section id="tab-reports" class="hide">
      <div class="card"><div id="reportsList" class="muted">No open reports.</div></div>
    </section>

    <section id="tab-codes" class="hide">
      <div class="card">
        <h3 style="margin-top:0">Generate an upload code</h3>
        <div class="row"><input id="c-name" placeholder="Uploader display name" /><button class="primary" onclick="makeCode()">Generate</button></div>
        <p id="newCode" class="mono hide" style="margin-top:10px"></p>
      </div>
      <div class="card"><table id="codesTable"><thead><tr><th>Code</th><th>Name</th><th>State</th><th></th></tr></thead><tbody></tbody></table></div>
    </section>
  </main>
</div>

<div id="status"></div>

<script>
let KEY = localStorage.getItem('ownerKey') || '';

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'X-Owner-Key': KEY, 'Content-Type': 'application/json', ...(opts.headers||{}) } });
  if (res.status === 403) { logout(); throw new Error('forbidden'); }
  return res;
}
function toast(msg) { const s = document.getElementById('status'); s.textContent = msg; s.classList.add('show'); setTimeout(()=>s.classList.remove('show'), 1800); }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function login() {
  KEY = document.getElementById('key').value.trim();
  const res = await fetch('/admin/api/session', { headers: { 'X-Owner-Key': KEY } });
  if (res.ok) { localStorage.setItem('ownerKey', KEY); showApp(); }
  else { const e = document.getElementById('loginErr'); e.textContent = 'That key was rejected.'; e.classList.remove('hide'); }
}
function logout() { localStorage.removeItem('ownerKey'); KEY=''; document.getElementById('app').classList.add('hide'); document.getElementById('login').classList.remove('hide'); }

function showApp() {
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  loadNews(); loadPosts(); loadReports(); loadCodes();
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['news','posts','reports','codes'].forEach(t => document.getElementById('tab-'+t).classList.toggle('hide', t!==b.dataset.tab));
});

async function loadNews() {
  const { news } = await (await api('/admin/api/news')).json();
  document.getElementById('newsList').innerHTML = news.map(n => `
    <div class="row" style="justify-content:space-between; border-bottom:1px solid var(--line); padding:8px 0">
      <div><span class="pill ${n.highlight?'on':''}">${esc(n.badge)}</span> <b>${esc(n.title)}</b> <span class="muted">- ${esc(n.dateText)}</span></div>
      <button class="small danger" onclick="delNews(${n.id})">Delete</button>
    </div>`).join('') || '<span class="muted">Nothing yet.</span>';
}
async function postNews() {
  const body = { badge:v('n-badge'), title:v('n-title'), dateText:v('n-date'), body:v('n-body'), highlight:document.getElementById('n-hl').checked };
  const res = await api('/admin/api/news', { method:'POST', body: JSON.stringify(body) });
  if (res.ok) { toast('Update published'); ['n-badge','n-title','n-date','n-body'].forEach(id=>document.getElementById(id).value=''); document.getElementById('n-hl').checked=false; loadNews(); }
  else toast('Missing fields');
}
async function delNews(id){ if(confirm('Delete this update?')){ await api('/admin/api/news/'+id,{method:'DELETE'}); loadNews(); toast('Deleted'); } }

async function loadPosts() {
  const { posts } = await (await api('/admin/api/posts')).json();
  document.querySelector('#postsTable tbody').innerHTML = posts.map(p => `
    <tr>
      <td>${esc(p.title)}</td><td>${esc(p.poster)}</td><td>${esc(p.category)}</td>
      <td>${p.likes}</td><td>${p.downloads}</td>
      <td>${p.reportCount ? '<span class="pill warn">'+p.reportCount+'</span>' : '0'}</td>
      <td><span class="pill ${p.visibility==='visible'?'on':'warn'}">${esc(p.visibility)}</span></td>
      <td>${p.visibility==='visible'
        ? `<button class="small danger" onclick="delPost('${p.id}')">Delete</button>`
        : `<button class="small" onclick="restorePost('${p.id}')">Restore</button>`}</td>
    </tr>`).join('') || '<tr><td colspan="8" class="muted">No posts.</td></tr>';
}
async function delPost(id){ if(confirm('Hide this post?')){ await api('/admin/api/posts/'+id,{method:'DELETE'}); loadPosts(); loadReports(); toast('Post hidden'); } }
async function restorePost(id){ await api('/admin/api/posts/'+id+'/restore',{method:'POST'}); loadPosts(); toast('Restored'); }

async function loadReports() {
  const { reports } = await (await api('/admin/api/reports')).json();
  document.getElementById('reportsList').innerHTML = reports.length ? reports.map(r => `
    <div class="card" style="background:var(--surface)">
      <div class="row" style="justify-content:space-between">
        <div><span class="pill warn">${esc(r.reason)}</span> <b>${esc(r.postTitle||'(deleted post)')}</b> <span class="muted">by ${esc(r.poster||'?')}</span></div>
        <span class="muted mono">${esc(r.postId)}</span>
      </div>
      ${r.note ? `<p style="margin:8px 0 0" class="muted">"${esc(r.note)}"</p>` : ''}
      <div class="row" style="margin-top:10px; gap:8px">
        <button class="small danger" onclick="delPost('${r.postId}')">Delete post</button>
        <button class="small" onclick="dismiss(${r.id})">Dismiss</button>
      </div>
    </div>`).join('') : '<span class="muted">No open reports.</span>';
}
async function dismiss(id){ await api('/admin/api/reports/'+id+'/dismiss',{method:'POST'}); loadReports(); toast('Dismissed'); }

async function loadCodes() {
  const { codes } = await (await api('/admin/api/codes')).json();
  document.querySelector('#codesTable tbody').innerHTML = codes.map(c => `
    <tr>
      <td class="mono">${esc(c.code)}</td><td>${esc(c.displayName)}</td>
      <td><span class="pill ${c.revoked?'warn':'on'}">${c.revoked?'revoked':'active'}</span></td>
      <td>${c.revoked?'':`<button class="small danger" onclick="revoke('${c.code}')">Revoke</button>`}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="muted">None.</td></tr>';
}
async function makeCode() {
  const name = v('c-name'); if(!name){ toast('Enter a name'); return; }
  const res = await api('/admin/api/codes', { method:'POST', body: JSON.stringify({ displayName:name }) });
  const j = await res.json();
  if (res.ok) { const e=document.getElementById('newCode'); e.textContent='New code for '+j.displayName+': '+j.code; e.classList.remove('hide'); document.getElementById('c-name').value=''; loadCodes(); }
}
async function revoke(code) {
  if (!confirm('Revoke '+code+'? Optionally also hide all their posts.')) return;
  const deletePosts = confirm('Also hide every post uploaded with this code?');
  await api('/admin/api/codes/'+code+'/revoke', { method:'POST', body: JSON.stringify({ deletePosts }) });
  loadCodes(); loadPosts(); toast('Revoked');
}

function v(id){ return document.getElementById(id).value.trim(); }

(async () => {
  if (KEY && (await fetch('/admin/api/session', { headers:{ 'X-Owner-Key':KEY } })).ok) showApp();
})();
</script>
</body>
</html>
